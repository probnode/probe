name: Bug report
description: Something in probe does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste an API key anywhere in this form.
        Security issues go privately to hello@probnode.com, not here (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Specification (spec/PROBE.md)
        - probe-format (Rust crate)
        - probe (CLI)
        - probe-format (Python package)
        - Conformance vectors
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "probe --version, cargo tree -i probe-format, or pip show probe-format"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Platform
      placeholder: "rustc 1.85 / Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The code or command you ran, and what it printed, including the full error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Dataset, schema, format, market or time range involved, if relevant.
