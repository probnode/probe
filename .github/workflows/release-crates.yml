name: release-crates

# Publishes probe-format, then probe-cli, to crates.io when a version tag is pushed. Uses crates.io
# trusted publishing (OIDC): configure the trusted publisher on crates.io for repository
# probnode/probe, workflow release-crates.yml, environment crates-io. A brand-new crate cannot be
# published that way: the first release uses the repository secret CARGO_REGISTRY_TOKEN, which is
# removed once the trusted publisher is configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'probnode/probe'
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      FIRST_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='probe-format'][0])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != crate version $v"; exit 1; }
      - run: cargo test --all-features
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.FIRST_TOKEN == ''
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          cargo publish -p probe-format
          cargo publish -p probe-cli
